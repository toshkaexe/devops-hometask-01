name: Typecheck

on:
  workflow_call:        # только так — снаружи сам по себе не запускается

jobs:
  typecheck:
    name: typecheck (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [back, front]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install deps
        working-directory: ${{ matrix.service }}
        run: npm ci

      # front (Vite) держит код в project references с "files": [] в корне,
      # поэтому голый tsc --noEmit там ничего не проверяет
      - name: Type-check
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f tsconfig.app.json ]; then
            npx tsc -p tsconfig.app.json --noEmit && npx tsc -p tsconfig.node.json --noEmit
          else
            npx tsc --noEmit
          fi
