name: CI/CD Pipeline

on:
  push:
    branches: [week*]

jobs:
  checks:
    uses: ./.github/workflows/typecheck.yaml

  test:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ci        # локальный тег образов, в Docker Hub не уходит
    steps:
      - uses: actions/checkout@v4

      # Собираем образы из текущего коммита. Фронт смотрит на back напрямую
      # через проброшенный порт 13000 (на VPS вместо этого https://<домен>/api).
      - name: Build images
        run: |
          # только DOCKERHUB_USERNAME: APP_VERSION из файла (latest) перебил бы ci
          export $(grep '^DOCKERHUB_USERNAME=' .env.development.compose)
          docker build -t $DOCKERHUB_USERNAME/todo-back:$APP_VERSION back
          docker build --build-arg VITE_API_URL=http://localhost:13000 \
            -t $DOCKERHUB_USERNAME/todo-front:$APP_VERSION front

      # CORS_ORIGIN в .env.development.back — прод-домен; для раннера
      # подменяем его на origin фронта из e2e (localhost:18080).
      - name: Start stack
        run: |
          cat > docker-compose.ci.yml <<'EOF'
          services:
            back:
              environment:
                CORS_ORIGIN: http://localhost:18080
          EOF
          docker compose --env-file .env.development.compose \
            -f docker-compose.yml -f docker-compose.ci.yml up -d
          timeout 60 bash -c 'until curl -sf http://localhost:13000/health; do sleep 2; done'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Playwright
        working-directory: front
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E
        run: set -a && . ./.env.development.e2e && cd front && npm test

      - name: Stack logs
        if: failure()
        run: docker compose --env-file .env.development.compose logs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: front/test-results/
          retention-days: 7

  build:
    name: build (${{ matrix.service }})
    needs: [checks, test]  # build стартует только если type-check и e2e зелёные
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: back
            build_args: ''
          - service: front
            build_args: --build-arg VITE_API_URL=${{ vars.VITE_API_URL }}

    steps:
      - uses: actions/checkout@v4 #клонирует код из репозитория

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: lint
        working-directory: ${{ matrix.service }}
        run: npm run lint

      - name: Docker Hub login
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      # Имя образа берём из того же файла, что и compose на VPS, чтобы теги совпали
      - name: Build & push
        run: |
          export $(grep '^DOCKERHUB_USERNAME=' .env.development.compose)
          IMAGE=$DOCKERHUB_USERNAME/todo-${{ matrix.service }}
          docker build ${{ matrix.build_args }} \
            -t $IMAGE:sha-${{ github.sha }} \
            -t $IMAGE:latest \
            ${{ matrix.service }}
          docker push $IMAGE:sha-${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # db не трогаем: --no-deps пересоздаёт только back и front
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ~/myapp
            sed -i "s|^APP_VERSION=.*|APP_VERSION=sha-${{ github.sha }}|" .env.development.compose
            docker compose --env-file .env.development.compose pull back front
            docker compose --env-file .env.development.compose up -d --no-deps back front

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # E2E_BASE_URL берётся из закоммиченного .env.production.e2e
      - name: Smoke
        run: make smoke-deployed

      - name: Deployed version matches commit
        run: |
          set -a && . ./.env.production.e2e && set +a
          HEALTH=$(curl -sSf --max-time 10 "${E2E_BASE_URL%/}/api/health")
          echo "$HEALTH"
          echo "$HEALTH" | grep -q "\"version\":\"sha-${{ github.sha }}\"" || {
            echo "✗ ожидали version=sha-${{ github.sha }}"
            exit 1
          }

  notify:
    needs: [checks, test, build, deploy, verify]
    if: always()           # иначе job пропустится, если какой-то из needs упал
    runs-on: ubuntu-latest
    steps:
      - name: Telegram
        run: |
          CHECKS="${{ needs.checks.result }}"
          TEST="${{ needs.test.result }}"
          BUILD="${{ needs.build.result }}"
          DEPLOY="${{ needs.deploy.result }}"
          VERIFY="${{ needs.verify.result }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          WHERE="${{ github.repository }} @ ${{ github.ref_name }}"

          if [ "$CHECKS" != "success" ]; then
            TEXT="❌ Type-check упал%0A$WHERE%0A$RUN_URL"
          elif [ "$TEST" != "success" ]; then
            TEXT="❌ E2E упали%0A$WHERE%0A$RUN_URL"
          elif [ "$BUILD" != "success" ]; then
            TEXT="❌ Build упал%0A$WHERE%0A$RUN_URL"
          elif [ "$DEPLOY" != "success" ]; then
            TEXT="❌ Deploy упал%0A$WHERE%0A$RUN_URL"
          elif [ "$VERIFY" != "success" ]; then
            TEXT="❌ Smoke не прошёл (задеплоено, но не отвечает корректно)%0A$WHERE%0A$RUN_URL"
          else
            TEXT="✅ Деплой успешен%0A$WHERE%0AActor: ${{ github.actor }}%0AVersion: sha-${{ github.sha }}"
          fi

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$TEXT" \
            -d "disable_web_page_preview=true")

          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || { echo "Telegram API rejected"; exit 1; }
